# escape-linux tmux config

# Refresh status bar every second
set -g status-interval 1

# Status bar styling
set -g status-style "bg=black,fg=white"
set -g status-left-length 120
set -g status-right ""
set -g status-left "#(python3 /game/engine/cli.py status 2>/dev/null || echo '[ESCAPE-LINUX]')"

# Lock down the session so the player can't escape via tmux
unbind d       # no detach
unbind c       # no new window
unbind %       # no split horizontal
unbind '"'     # no split vertical
unbind &       # no kill window
unbind x       # no kill pane

# Disable mouse (keep it terminal-only)
set -g mouse off

# Visual bell instead of audio
set -g visual-bell on

# Keep history large enough for log grep sessions
set -g history-limit 50000
